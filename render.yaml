services:
  # 1. Next.js Frontend
  - type: web
    name: kiyara-frontend
    env: node
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://kiyara-backend-omhf.onrender.com

  # 2. Python Backend (FastAPI + VideoSDK + Gemini)
  - type: web
    name: kiyara-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: kiyara-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: kiyara-redis
          property: connectionString

  # 3. Redis Cache
  - type: redis
    name: kiyara-redis
    plan: free
    ipAllowList: []

databases:
  # 4. PostgreSQL with pgvector
  - name: kiyara-postgres
    plan: free
    databaseName: kiyara_db
    user: kiyara_user
