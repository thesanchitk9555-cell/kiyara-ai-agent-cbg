services:
  - type: web
    name: kiyara-frontend
    env: node
    rootDir: frontend
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: kiyara-backend
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: kiyara-backend
    env: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: kiyara-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: kiyara-redis
          property: connectionString

  - type: redis
    name: kiyara-redis
    plan: free

databases:
  - name: kiyara-postgres
    plan: starter
    databaseName: kiyara_db
    user: kiyara_user
